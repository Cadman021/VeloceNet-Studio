[package]
name = "netstudio_engine"
version = "0.3.0"
edition = "2021"
authors = ["VeloceNet-Studio Contributors"]
repository = "https://github.com/Cadman021/VeloceNet-Studio"
license = "GPL-3.0-or-later"
description = "High-performance network probing core for NetStudio"

[lib]
name = "netstudio_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.5", features = ["all"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# NOTE: deliberately NOT `panic = "abort"`. FFI boundary functions must be
# able to unwind into `ffi_guard` (see ffi.rs); abort would kill the whole
# host process on any engine-internal bug.
panic = "unwind"
strip = true
