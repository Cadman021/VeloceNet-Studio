name: CI

# Pin the SDK instead of tracking `channel: stable`: the checked-in
# pubspec.lock is generated on this version, and several dependencies are
# SDK-conditional. With an unpinned runner on Flutter 3.50 the lock still
# pinned nativeapi 0.5.10, whose run_native_app.dart uses `Isolate.create`
# (gone in Dart 3.14), so `flutter test` stopped compiling; the 0.5.11 fix
# requires Dart ^3.14 and can only be locked from a 3.50 SDK. `flutter
# analyze` also fails on info-level findings, so a newer stable that
# deprecates any API the tree uses turns every PR red on its own.
# To move to 3.50: upgrade the local SDK first, then regenerate the lock and
# land the material_ui / leanflutter 0.6 bumps in one PR.
env:
  FLUTTER_VERSION: "3.47.0"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Version sync check
        shell: pwsh
        run: ./tool/check_versions.ps1

  flutter-linux:
    name: Flutter analyze + test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub

  rust:
    name: Rust build + test + clippy
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native_engine
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Format check
        run: cargo fmt --check

  # Non-Windows lints rot silently when CI only builds Windows: the
  # #[cfg(not(windows))] fallback modules are never compiled there
  # (see the unused-import/variable warnings reported against stable
  # 1.98). This job compiles exactly those paths.
  rust-linux:
    name: Rust clippy + test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native_engine
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (deny warnings)
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test --release
