name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub

  rust:
    name: Rust build + test + clippy
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native_engine
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Clippy
        run: cargo clippy --release -- -D warnings

  # Non-Windows lints rot silently when CI only builds Windows: the
  # #[cfg(not(windows))] fallback modules are never compiled there
  # (see the unused-import/variable warnings reported against stable
  # 1.98). This job compiles exactly those paths.
  rust-linux:
    name: Rust clippy + test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native_engine
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (deny warnings)
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test --release
