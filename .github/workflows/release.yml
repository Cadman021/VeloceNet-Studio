name: Release (Windows + Linux + macOS)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust engine
        working-directory: native_engine
        run: cargo build --release

      - name: Stage engine DLL
        shell: pwsh
        run: |
          Copy-Item native_engine/target/release/netstudio_engine.dll -Destination . -Force

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle DLL next to the executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/windows/x64/runner/Release -Filter *.exe | Select-Object -First 1
          if ($null -eq $exe) { throw "No exe found in build/windows/x64/runner/Release" }
          Copy-Item netstudio_engine.dll -Destination build/windows/x64/runner/Release -Force
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath velocenet-studio-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocenet-studio-windows-x64
          path: velocenet-studio-windows-x64.zip

  build-linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust engine
        working-directory: native_engine
        run: cargo build --release

      - name: Install Flutter Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Build Linux release
        run: flutter build linux --release

      - name: Bundle .so next to the executable
        run: |
          cp native_engine/target/release/libnetstudio_engine.so build/linux/x64/release/bundle/
          tar -czf velocenet-studio-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocenet-studio-linux-x64
          path: velocenet-studio-linux-x64.tar.gz

  build-macos:
    name: Build macOS bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust engine
        working-directory: native_engine
        run: cargo build --release

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Build macOS release
        run: flutter build macos --release

      - name: Bundle .dylib inside the .app and zip it
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          cp native_engine/target/release/libnetstudio_engine.dylib "$APP/Contents/MacOS/"
          ditto -c -k --sequesterRsrc --keepParent "$APP" velocenet-studio-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocenet-studio-macos-arm64
          path: velocenet-studio-macos-arm64.zip

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
